name: CI/CD RedDona

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint + pruebas unitarias (cobertura >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias con cobertura
        run: npm run test:coverage
        env:
          JWT_SECRET: test-secret
          NODE_ENV: test

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security-scan:
    name: Escaneo de seguridad (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Levantar la API en segundo plano
        run: |
          nohup node src/server.js > server.log 2>&1 &
          npx wait-on http://localhost:3000/health
        env:
          JWT_SECRET: test-secret
          PORT: 3000
          # Origen restringido a proposito, para validar en el escaneo que el
          # allowlist de CORS efectivamente rechaza origenes no autorizados.
          CORS_ORIGIN: https://app.reddona.org

      - name: OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-report
          chmod -R a+rwx zap-report
          docker run --rm --network host \
            -v "$(pwd)/zap-report:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000/health -r report_html.html -w report_md.md -J report_json.json -a
        continue-on-error: true

      - name: Publicar reporte de ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report/

  code-quality:
    name: Analisis de calidad de codigo (SonarQube)
    runs-on: ubuntu-latest
    needs: test
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/api/system/status"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias y generar cobertura (lcov)
        run: npm ci && npm run test:coverage
        env:
          JWT_SECRET: test-secret
          NODE_ENV: test

      - name: Esperar a que SonarQube este operativo
        id: wait_sonar
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s http://localhost:9000/api/system/status || true)
            echo "intento $i: $status"
            if echo "$status" | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 10
          done
          echo "SonarQube no quedo operativo a tiempo"
          exit 1

      - name: Configurar credenciales y generar token de analisis
        id: sonar_token
        if: steps.wait_sonar.outcome == 'success'
        continue-on-error: true
        run: |
          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password" \
            --data-urlencode "login=admin" \
            --data-urlencode "previousPassword=admin" \
            --data-urlencode "password=ReddonaSonar123!"
          RESP=$(curl -s -u admin:ReddonaSonar123! -X POST "http://localhost:9000/api/user_tokens/generate" \
            --data-urlencode "name=ci-$(date +%s)")
          echo "$RESP"
          TOKEN=$(echo "$RESP" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then exit 1; fi
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Analisis con sonar-scanner
        id: sonar_scan
        if: steps.sonar_token.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -e SONAR_TOKEN="${{ env.SONAR_TOKEN }}" \
            -v "$(pwd):/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=reddona \
            -Dsonar.projectName=RedDona \
            -Dsonar.sources=src \
            -Dsonar.tests=tests \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.exclusions=node_modules/**

      - name: Esperar el computo del quality gate
        if: steps.sonar_scan.outcome == 'success'
        run: sleep 15

      - name: Exportar metricas de SonarQube
        if: steps.sonar_scan.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p docs/calidad
          curl -s -u "${{ env.SONAR_TOKEN }}:" \
            "http://localhost:9000/api/measures/component?component=reddona&metricKeys=bugs,vulnerabilities,code_smells,sqale_index,sqale_rating,duplicated_lines_density,coverage,ncloc,complexity" \
            -o docs/calidad/sonarqube-metrics.json
          cat docs/calidad/sonarqube-metrics.json

      - name: Publicar metricas de SonarQube
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-metrics
          path: docs/calidad/sonarqube-metrics.json
          if-no-files-found: warn

  build-and-push:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Definir nombre de imagen en minusculas
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-staging:
    name: Despliegue automatico a entorno de prueba
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Definir nombre de imagen en minusculas
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Desplegar contenedor en entorno de prueba
        run: |
          docker run -d --name reddona-staging -p 3000:3000 \
            -e JWT_SECRET=staging-secret \
            -e ADMIN_BOOTSTRAP_EMAIL=admin@reddona.org \
            -e ADMIN_BOOTSTRAP_PASSWORD=StagingAdmin123! \
            -e CORS_ORIGIN=https://app.reddona.org \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5

      - name: Smoke test del entorno de prueba
        run: |
          curl -sf http://localhost:3000/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Detener contenedor de prueba
        if: always()
        run: docker rm -f reddona-staging || true
